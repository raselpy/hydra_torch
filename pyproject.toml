# pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra_torch"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0", 
    "torchvision>=0.15.0", 
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0", 
    "pydantic>=2.0.0", 
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0", 
    "matplotlib>=3.7.0", 
    "pytorch-lightning>=2.0.0",
    "mlflow>=2.13.0,<3.0.0"  # ✅ Added MLflow
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "ruff>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hydra_torch*", "config_schema*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]