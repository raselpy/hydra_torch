services:
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:////data/mlruns.db
        --artifacts-destination /data/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  train:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mlflow-server:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - HYDRA_FULL_ERROR=1
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["trainer=gpu"]

  register:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mlflow-server:
        condition: service_healthy
    entrypoint: ["python", "-m", "src.hydra_torch.register_model"]
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - REGISTERED_MODEL_NAME=hydra_torch_CIFAR10Model
      - MODEL_ALIAS=champion
      - CHECKPOINT_PATH=checkpoints/best.ckpt
    volumes:
      - ./checkpoints:/app/checkpoints:ro

  serve:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["uvicorn"]
    command: ["src.hydra_torch.serve:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      mlflow-server:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - REGISTERED_MODEL_NAME=hydra_torch_CIFAR10Model
      - MODEL_ALIAS=champion
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
